            padding: 0;
            position: absolute;

            left: 0;

            z-index: 1;

        #modalVoteWeight::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;

        .slider-marks {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 6px;
            pointer-events: none;
            z-index: 0;
        }

        .slider-marks-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--blockchain-color);
            border-radius: 2px;
        }

        .slider-marks span {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 4px #000;
            top: 0px;
            transform: translate(-50%, -50%);
            user-select: none;
            pointer-events: auto;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 4;
            transition: all 0.2s ease;
        }

        .slider-marks span:hover {
            color: var(--blockchain-color);
            transform: translate(-50%, -50%) scale(1.2);
        }

        .slider-marks span[data-value="1"]  { left: 4%; }
        .slider-marks span[data-value="20"]  { left: 21.5%; }
        .slider-marks span[data-value="40"]  { left: 40%; }
        .slider-marks span[data-value="60"]  { left: 58.5%; }
        .slider-marks span[data-value="80"]  { left: 77.5%; }
        .slider-marks span[data-value="100"] { left: 96%; }

        .slider-marks span::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #777;
            border: 3px solid #333;
            border-radius: 50%;
            z-index: -1;
            transition: all 0.2s ease;
        }

        .slider-marks span:hover::before {
            background: var(--blockchain-color);
            border-color: #000;
            box-shadow: 0 0 12px var(--blockchain-color);
            transform: scale(1.3);
        }

<script>
var salbee = "";
var salsports = "";
var nf = new Intl.NumberFormat(); 
let currentFilter = 'L1'; 
var ism = false;
var blkdata = [];

function applyFilter() {
    const select = document.getElementById('filterSelect');
    currentFilter = select.value; 
    loadTable();
}

  steem.api.getAccounts(['multistrike'], function(err, response) {
    if (!err) {
	  document.getElementById('mss').textContent = nf.format(Number(response[0].balance.replace(" STEEM",""))) + " STEEM";
    }  
  });

async function getBalance(tokenname) {
    const response = await fetch('https://api.hive-engine.com/rpc/contracts', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            jsonrpc: "2.0",
            method: "findOne",
            params: {
                contract: "tokens",
                table: "balances",
                query: {
                    symbol: tokenname,
                    account: "multistrike"
                }
            },
            id: 1
        })
    });

    const data = await response.json();
	return data.result.balance;
}

getBalance("BEE").then(result => {
   salbee = result;
});
getBalance("SPORTS").then(result => {
   salsports = result / 100000;
});

  hive.api.getAccounts(['multistrike'], function(err, response) {
    if (!err) {
	  document.getElementById('msh').textContent = nf.format(Number(response[0].balance.replace(" HIVE", ""))) + " HIVE\n" + nf.format(Number(salsports),0) + "M SPORTS\n " + nf.format(Number(salbee)) + " BEE";
    }  
    });
	
    blurt.api.setOptions({ url: 'https://rpc.blurt.blog/' });
	blurt.api.getAccounts(['multistrike'], function(err, response) {
    if (!err) {
	  document.getElementById('msb').textContent = nf.format(Number(response[0].balance.replace(" BLURT",""))) + " BLURT";
    }
  });

// SLIDER MODAL
document.getElementById("modalVoteWeight")?.addEventListener("input", function() {
    document.getElementById("modalWeightValue").textContent = this.value;
});

document.querySelectorAll('.slider-marks span').forEach(mark => {
    mark.addEventListener('click', function() {
        const value = this.getAttribute('data-value');
        const slider = document.getElementById("modalVoteWeight");
        slider.value = value;
        document.getElementById("modalWeightValue").textContent = value;
    });
});

    let activeColumn = null;

function toggleColumn(col) {
    const header = document.querySelector('.table-header');
    const rows = document.querySelectorAll('.table-body-row');
    const expandedClass = `expanded-${col}`;

    ['steem', 'hive', 'blurt'].forEach(c => {
        const cls = `expanded-${c}`;
        header.classList.remove(cls);
        rows.forEach(r => r.classList.remove(cls));
        const th = header.querySelector(`.col-${c}`);
        if (th) th.classList.remove('active');
    });

    if (activeColumn === col) {
        activeColumn = null;
        return;
    }

    activeColumn = col;
    header.classList.add(expandedClass);
    rows.forEach(r => r.classList.add(expandedClass));
    
    const activeTh = header.querySelector(`.col-${col}`);
    if (activeTh) activeTh.classList.add('active');
}

function createEventCell(item) {
 if (currentFilter != "G" && currentFilter != "M" && currentFilter != "S") {
	const bodyName = item.perm.replace(/@/, '').replace(/\//g, '_o_o_o_');
    const colore = item.blockchain === "HIVE" ? "#ffff00" : 
                   item.blockchain === "BLURT" ? "#FF6600" : "#90ee90";
    const chain = item.blockchain;

    const permh = item.perm + 'home';
    const permd = item.perm + 'draw';
    const perma = item.perm + 'away';
    const isDisabled = new Date(item.matchdate) <= new Date() || 
                       item.tstatus === "Match Finished" || 
                       item.pstatus === "Distributed";

    return `

let currentPermlink = "", currentChain = "", currentMsg = "";

function vote(perm, chain, msg) {
    perm = perm.replace("graphene-faucet/@graphene-faucet/", "");
    currentPermlink = perm;
    currentChain = chain;
    currentMsg = msg;
    
    // Prendi username dall'input
    const username = document.getElementById("userInput").value.trim();
    if (!username) {
        alert("Please enter your username first!");
        return;
    }
    
    showVoteModal(chain, perm, msg);
}

function showVoteModal(chain, permlink, msg) {
    const modal = document.getElementById("voteModal");
    const message = document.getElementById("modalMessage");
    const gkaBtn = document.getElementById("voteWithGKA");
    const gkwBtn = document.getElementById("voteWithGKW");
    const cancelBtn = document.getElementById("cancelVote");
    
    const colore = chain === "HIVE" ? "#ffff00" : 
                   chain === "BLURT" ? "#FF6600" : "#90ee90";
    
    // Imposta variable CSS per il colore
    modal.style.setProperty('--blockchain-color', colore);
    
    // Colori dei bottoni (sfondo)
    message.style.setProperty('color', colore);
    gkaBtn.style.setProperty('background', colore);
    gkwBtn.style.setProperty('background', colore);
    cancelBtn.style.setProperty('background', colore);
    
    // TESTO NERO PER TUTTE LE CHAINS
    gkaBtn.style.setProperty('color', 'black');
    gkwBtn.style.setProperty('color', 'black');
    cancelBtn.style.setProperty('color', 'black');
    
    document.getElementById("modalMessage").textContent = msg;
    document.getElementById("modalWeightValue").textContent = "100";
    document.getElementById("modalVoteWeight").value = "100";
    
    modal.classList.add("show");
}

function hideVoteModal() {
    document.getElementById("voteModal").classList.remove("show");
}

function startPollingForOperation(tm, username, site, action, keytype, onSuccess, onFailure) {
    var ckUrl = `https://timeapp.foundation/ckr.php?params=${tm} ${site} ${action} ${keytype} ${username}`;
    
    var pollCount = 0;
    var startTime = Date.now();
    var finalResponseReceived = false;
    
    var pollInterval = setInterval(function() {
        pollCount++;
        
        $.ajax({
            url: ckUrl,
            type: 'POST',
            timeout: 5000,
            success: function(response) {
                response = (response || '').trim();
                
                if (response === 'NA') {
                    console.log('[POLLING] Still waiting...');
                }
                else if (response === 'Ok') {
                    clearInterval(pollInterval);
                    finalResponseReceived = true;
                    if (onSuccess) onSuccess();
                }
                else {
                    clearInterval(pollInterval);
                    finalResponseReceived = true;
                    if (onFailure) onFailure('Operation failed with status: ' + response);
                }
            },
            error: function(xhr, status, error) {
                console.log('[POLLING Error] #' + pollCount + ':', status);
            }
        });
    }, 3000);
    
    setTimeout(function() {
        if (finalResponseReceived) return;
        clearInterval(pollInterval);
        if (onFailure) onFailure('No response after 2 minutes');
    }, 120000);
}

window.onload = function() {
    loadTable();
};

</script>
